name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/control-panel/package-lock.json

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6

      - name: Init TFLint plugins
        run: tflint --init --config .tflint.hcl

      - name: Cache Python venvs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: venv-cache
        with:
          path: |
            services/simulation/venv
            services/stream-processor/venv
            tools/dbt/venv
            services/airflow/venv
            tools/great-expectations/venv
            schemas/lakehouse/venv
            services/ai-chat/venv
          key: lint-venvs-${{ runner.os }}-py3.13-${{ hashFiles('services/simulation/pyproject.toml', 'services/stream-processor/pyproject.toml', 'tools/great-expectations/requirements.txt', 'services/ai-chat/requirements.txt') }}
          restore-keys: |
            lint-venvs-${{ runner.os }}-py3.13-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Create venvs and install dependencies for all services
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          # simulation - install full dev dependencies for type stubs
          python -m venv services/simulation/venv
          services/simulation/venv/bin/pip install --quiet -e "services/simulation/[dev]"
          # Install boto3 type stubs and opentelemetry packages for type checking
          services/simulation/venv/bin/pip install --quiet "boto3-stubs[essential]"

          # stream-processor - install with opentelemetry packages
          python -m venv services/stream-processor/venv
          services/stream-processor/venv/bin/pip install --quiet -e "services/stream-processor/[dev]"

          # dbt - install with pyspark for type checking
          python -m venv tools/dbt/venv
          tools/dbt/venv/bin/pip install --quiet mypy pyspark

          # airflow - install with runtime dependencies for type checking
          python -m venv services/airflow/venv
          services/airflow/venv/bin/pip install --quiet mypy types-requests duckdb apache-airflow deltalake

          # great-expectations - install from requirements.txt
          python -m venv tools/great-expectations/venv
          tools/great-expectations/venv/bin/pip install --quiet mypy types-PyYAML
          tools/great-expectations/venv/bin/pip install --quiet -r tools/great-expectations/requirements.txt

          # lakehouse - install with pyspark and delta-spark
          python -m venv schemas/lakehouse/venv
          schemas/lakehouse/venv/bin/pip install --quiet mypy pyspark delta-spark

          # ai-chat - install with boto3 type stubs for mypy
          python -m venv services/ai-chat/venv
          services/ai-chat/venv/bin/pip install --quiet mypy "boto3-stubs[essential]"
          services/ai-chat/venv/bin/pip install --quiet -r services/ai-chat/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: services/control-panel

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  unit-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Cache Python venvs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: test-venv-cache
        with:
          path: |
            services/simulation/venv
            services/stream-processor/venv
          key: test-venvs-${{ runner.os }}-py3.13-${{ hashFiles('services/simulation/pyproject.toml', 'services/stream-processor/pyproject.toml') }}
          restore-keys: |
            test-venvs-${{ runner.os }}-py3.13-

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/control-panel/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: services/control-panel

      - name: Install simulation dependencies and run tests
        working-directory: services/simulation
        run: |
          if [ ! -d venv ]; then
            python -m venv venv
            ./venv/bin/pip install --quiet -e ".[dev]"
          fi
          ./venv/bin/pytest -v --tb=short

      - name: Install stream-processor dependencies and run tests
        working-directory: services/stream-processor
        run: |
          if [ ! -d venv ]; then
            python -m venv venv
            ./venv/bin/pip install --quiet -e ".[dev]"
          fi
          ./venv/bin/pytest -v --tb=short

  frontend-build:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/control-panel/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: services/control-panel

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: services/control-panel

      - name: Build
        run: npm run build
        working-directory: services/control-panel

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE '^(services/simulation/src/api/|services/control-panel/src/|schemas/api/)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  api-contract-validation:
    needs: [lint-and-typecheck, detect-changes]
    if: needs.detect-changes.outputs.api-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv services/simulation/venv
          services/simulation/venv/bin/pip install --quiet -e "services/simulation/[dev]"

      - name: Export OpenAPI spec
        run: |
          services/simulation/venv/bin/python services/simulation/scripts/export-openapi.py

      - name: Validate OpenAPI spec
        run: |
          cd services/simulation
          ./venv/bin/pytest tests/test_api_contract.py::test_openapi_spec_is_valid -v

      - name: Install frontend dependencies
        run: |
          cd services/control-panel
          npm ci

      - name: Generate TypeScript types
        run: |
          cd services/control-panel
          npm run generate-types

      - name: Check TypeScript types match OpenAPI spec
        run: |
          cd services/simulation
          ./venv/bin/pytest tests/test_api_contract.py::test_typescript_types_match_openapi -v

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: openapi-spec
          path: schemas/api/openapi.json
