name: Deploy Landing Page

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      control-panel: ${{ steps.filter.outputs.control-panel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -q '^services/control-panel/'; then
            echo "control-panel=true" >> "$GITHUB_OUTPUT"
          else
            echo "control-panel=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-landing-page:
    needs: [detect-changes]
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && needs.detect-changes.outputs.control-panel == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/control-panel/package-lock.json

      - name: Install dependencies
        working-directory: services/control-panel
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/rideshare-github-actions
          aws-region: us-east-1

      - name: Get Lambda function URL
        id: lambda
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name rideshare-auth-deploy \
            --query 'FunctionUrl' --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Get Chat Lambda function URL
        id: chat-lambda
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name rideshare-ai-chat \
            --query 'FunctionUrl' --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build React app with production environment variables
        working-directory: services/control-panel
        env:
          VITE_API_URL: https://api.ridesharing.portfolio.andresbrocco.com
          VITE_WS_URL: wss://api.ridesharing.portfolio.andresbrocco.com/ws
          VITE_LAMBDA_URL: ${{ steps.lambda.outputs.url }}
          VITE_CHAT_LAMBDA_URL: ${{ steps.chat-lambda.outputs.url }}
        run: npm run build

      - name: Sync build output to S3
        working-directory: services/control-panel
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          BUCKET="rideshare-${ACCOUNT_ID}-frontend"

          # 1. Upload new hashed assets (no --delete yet)
          aws s3 sync dist/ "s3://${BUCKET}/" \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" \
            --exclude "*.html"

          # 2. Upload new HTML (points to new assets that are now in S3)
          aws s3 sync dist/ "s3://${BUCKET}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

          # 3. Clean up stale old assets (safe — new HTML already live)
          aws s3 sync dist/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" \
            --exclude "*.html"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Frontend SPA distribution'].Id" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "Error: CloudFront distribution not found"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

      - name: Output deployment summary
        run: |
          echo "Frontend deployed to S3 and CloudFront cache invalidated"
          echo "Landing Page:  https://ridesharing.portfolio.andresbrocco.com"
          echo "Control Panel: https://control-panel.ridesharing.portfolio.andresbrocco.com (via ALB/EKS)"
