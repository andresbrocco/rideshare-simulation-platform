name: Build Images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which services to build'
        required: true
        type: choice
        options:
          - all
          - simulation
          - stream-processor
          - control-panel
          - bronze-ingestion
          - hive-metastore
          - performance-controller
          - osrm
          - otel-collector
          - dbt-docs

permissions:
  contents: read

jobs:
  detect-changes:
    if: github.event_name != 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulation: ${{ steps.filter.outputs.simulation }}
      stream-processor: ${{ steps.filter.outputs.stream-processor }}
      control-panel: ${{ steps.filter.outputs.control-panel }}
      bronze-ingestion: ${{ steps.filter.outputs.bronze-ingestion }}
      hive-metastore: ${{ steps.filter.outputs.hive-metastore }}
      performance-controller: ${{ steps.filter.outputs.performance-controller }}
      osrm: ${{ steps.filter.outputs.osrm }}
      otel-collector: ${{ steps.filter.outputs.otel-collector }}
      dbt-docs: ${{ steps.filter.outputs.dbt-docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            simulation:
              - 'services/simulation/**'
              - 'schemas/**'
            stream-processor:
              - 'services/stream-processor/**'
            control-panel:
              - 'services/control-panel/**'
            bronze-ingestion:
              - 'services/bronze-ingestion/**'
            hive-metastore:
              - 'services/hive-metastore/**'
            performance-controller:
              - 'services/performance-controller/**'
            osrm:
              - 'services/osrm/**'
            otel-collector:
              - 'services/otel-collector/**'
            dbt-docs:
              - 'services/dbt-docs/**'
              - 'tools/dbt/models/**'
              - 'tools/dbt/macros/**'
              - 'tools/dbt/dbt_project.yml'
              - 'tools/dbt/packages.yml'

  generate-matrix:
    needs: [detect-changes]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_services: ${{ steps.set-matrix.outputs.has_services }}
    steps:
      - name: Build service matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ github.event.inputs.scope }}
          CHANGED_SIMULATION: ${{ needs.detect-changes.outputs.simulation }}
          CHANGED_STREAM_PROCESSOR: ${{ needs.detect-changes.outputs.stream-processor }}
          CHANGED_CONTROL_PANEL: ${{ needs.detect-changes.outputs.control-panel }}
          CHANGED_BRONZE_INGESTION: ${{ needs.detect-changes.outputs.bronze-ingestion }}
          CHANGED_HIVE_METASTORE: ${{ needs.detect-changes.outputs.hive-metastore }}
          CHANGED_PERFORMANCE_CONTROLLER: ${{ needs.detect-changes.outputs.performance-controller }}
          CHANGED_OSRM: ${{ needs.detect-changes.outputs.osrm }}
          CHANGED_OTEL_COLLECTOR: ${{ needs.detect-changes.outputs.otel-collector }}
          CHANGED_DBT_DOCS: ${{ needs.detect-changes.outputs.dbt-docs }}
        run: |
          SERVICES='[]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SCOPE="$INPUT_SCOPE"
            if [ "$SCOPE" = "all" ]; then
              SERVICES=$(cat <<'EOF'
          [
            {"service":"simulation","target":"production"},
            {"service":"stream-processor"},
            {"service":"control-panel","target":"production"},
            {"service":"bronze-ingestion"},
            {"service":"hive-metastore"},
            {"service":"performance-controller"},
            {"service":"osrm"},
            {"service":"otel-collector"},
            {"service":"dbt-docs"}
          ]
          EOF
              )
            else
              case "$SCOPE" in
                simulation)     SERVICES='[{"service":"simulation","target":"production"}]' ;;
                control-panel)  SERVICES='[{"service":"control-panel","target":"production"}]' ;;
                *)              SERVICES="[{\"service\":\"$SCOPE\"}]" ;;
              esac
            fi
          else
            # Push event — build only changed services
            ITEMS=()
            if [ "$CHANGED_SIMULATION" = "true" ]; then
              ITEMS+=('{"service":"simulation","target":"production"}')
            fi
            if [ "$CHANGED_STREAM_PROCESSOR" = "true" ]; then
              ITEMS+=('{"service":"stream-processor"}')
            fi
            if [ "$CHANGED_CONTROL_PANEL" = "true" ]; then
              ITEMS+=('{"service":"control-panel","target":"production"}')
            fi
            if [ "$CHANGED_BRONZE_INGESTION" = "true" ]; then
              ITEMS+=('{"service":"bronze-ingestion"}')
            fi
            if [ "$CHANGED_HIVE_METASTORE" = "true" ]; then
              ITEMS+=('{"service":"hive-metastore"}')
            fi
            if [ "$CHANGED_PERFORMANCE_CONTROLLER" = "true" ]; then
              ITEMS+=('{"service":"performance-controller"}')
            fi
            if [ "$CHANGED_OSRM" = "true" ]; then
              ITEMS+=('{"service":"osrm"}')
            fi
            if [ "$CHANGED_OTEL_COLLECTOR" = "true" ]; then
              ITEMS+=('{"service":"otel-collector"}')
            fi
            if [ "$CHANGED_DBT_DOCS" = "true" ]; then
              ITEMS+=('{"service":"dbt-docs"}')
            fi

            if [ ${#ITEMS[@]} -gt 0 ]; then
              SERVICES=$(printf '%s\n' "${ITEMS[@]}" | jq -s '.')
            fi
          fi

          COMPACT=$(echo "$SERVICES" | jq -c '.')
          echo "matrix={\"include\":$COMPACT}" >> "$GITHUB_OUTPUT"

          COUNT=$(echo "$SERVICES" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "has_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_services=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Services to build ($COUNT):"
          echo "$SERVICES" | jq .

  build:
    needs: [generate-matrix]
    if: always() && needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/rideshare-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2

      - name: Download OSRM data from S3 (or LFS fallback)
        if: matrix.service == 'osrm'
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          S3_KEY="osrm/sao-paulo-metro.osm.pbf"
          S3_BUCKET="rideshare-${ACCOUNT_ID}-build-assets"
          LOCAL_PATH="services/osrm/data/sao-paulo-metro.osm.pbf"

          mkdir -p services/osrm/data

          if aws s3api head-object --bucket "$S3_BUCKET" --key "$S3_KEY" 2>/dev/null; then
            echo "Downloading OSRM data from S3 cache..."
            aws s3 cp "s3://${S3_BUCKET}/${S3_KEY}" "$LOCAL_PATH"
          else
            echo "S3 cache miss — pulling from Git LFS..."
            git lfs pull --include="services/osrm/data/sao-paulo-metro.osm.pbf"

            FILE_SIZE=$(stat --printf="%s" "$LOCAL_PATH" 2>/dev/null || stat -f "%z" "$LOCAL_PATH")
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "ERROR: LFS file is too small (${FILE_SIZE} bytes) — likely a pointer file"
              exit 1
            fi

            echo "Uploading OSRM data to S3 for future builds..."
            aws s3 cp "$LOCAL_PATH" "s3://${S3_BUCKET}/${S3_KEY}"
          fi

          echo "OSRM data ready ($(du -h "$LOCAL_PATH" | cut -f1))"

      - name: Get Lambda function URL
        if: matrix.service == 'control-panel'
        id: lambda
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name rideshare-auth-deploy \
            --query 'FunctionUrl' --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }} image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rideshare/${{ matrix.service }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          LAMBDA_URL: ${{ steps.lambda.outputs.url }}
          SERVICE: ${{ matrix.service }}
          TARGET: ${{ matrix.target }}
        run: |
          # Simulation needs the repo-root schemas/ directory inside its build context
          if [ "$SERVICE" = "simulation" ]; then
            cp -r schemas services/simulation/schemas
          fi

          # Control panel imports design/tokens.json from outside its service directory
          if [ "$SERVICE" = "control-panel" ]; then
            cp -r design services/control-panel/design
          fi

          # dbt-docs generates docs from the dbt project at build time
          if [ "$SERVICE" = "dbt-docs" ]; then
            cp -r tools/dbt services/dbt-docs/dbt-project
          fi

          CACHE_REPO="$ECR_REGISTRY/$ECR_REPOSITORY"

          BUILD_ARGS=(
            --file "services/$SERVICE/Dockerfile"
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            --cache-from "type=registry,ref=${CACHE_REPO}:buildcache"
            --cache-to "type=registry,ref=${CACHE_REPO}:buildcache,mode=max"
            --push
          )

          if [ -n "$TARGET" ]; then
            BUILD_ARGS+=(--target "$TARGET")
          fi

          # Control panel needs production URLs baked into the Vite bundle
          if [ "$SERVICE" = "control-panel" ]; then
            BUILD_ARGS+=(
              --build-arg "VITE_API_URL=https://api.ridesharing.portfolio.andresbrocco.com"
              --build-arg "VITE_WS_URL=wss://api.ridesharing.portfolio.andresbrocco.com/ws"
              --build-arg "VITE_LAMBDA_URL=${LAMBDA_URL}"
            )
          fi

          docker buildx build "${BUILD_ARGS[@]}" "services/$SERVICE"

          if [ "$SERVICE" = "simulation" ]; then
            rm -rf services/simulation/schemas
          fi

          if [ "$SERVICE" = "control-panel" ]; then
            rm -rf services/control-panel/design
          fi

          if [ "$SERVICE" = "dbt-docs" ]; then
            rm -rf services/dbt-docs/dbt-project
          fi

      - name: Output image URIs
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rideshare/${{ matrix.service }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Pushed $SERVICE images:"
          echo "  SHA tag:    $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "  Latest tag: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
